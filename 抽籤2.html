<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上抽籤系統（動畫版）</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .btn-setup {
            background-color: #4CAF50;
            color: white;
        }
        .btn-setup:hover {
            background-color: #45a049;
        }
        .btn-draw {
            background-color: #008CBA;
            color: white;
        }
        .btn-draw:hover {
            background-color: #007bb5;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .status-box {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 6px;
            font-size: 14px;
            color: #495057;
        }

        /* 籤筒與抽籤動畫區域 */
        .stage {
            height: 180px;
            margin-top: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            background: #fafafa;
            border-radius: 12px;
            border: 1px dashed #e0e0e0;
        }

        /* 籤筒圖示 */
        .bucket {
            font-size: 70px;
            z-index: 2;
            user-select: none;
            transition: transform 0.1s;
        }

        /* 抽出飛出的籤 */
        .stick {
            position: absolute;
            bottom: 30px;
            width: 180px;
            padding: 12px 20px;
            background-color: #fff;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            opacity: 0;
            z-index: 3;
            transform-origin: center bottom;
        }

        /* 結果樣式 */
        .stick.win {
            color: #d9534f;
            border: 2px solid #d9534f;
            background-color: #fff5f5;
        }
        .stick.lose {
            color: #6c757d;
            border: 2px solid #6c757d;
            background-color: #f8f9fa;
        }

        /* 動畫效果定義 */

        /* 1. 籤筒搖晃動畫 */
        @keyframes shake {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(-12deg); }
            40% { transform: rotate(12deg); }
            60% { transform: rotate(-8deg); }
            80% { transform: rotate(8deg); }
            100% { transform: rotate(0deg); }
        }
        .shaking {
            animation: shake 0.6s ease-in-out infinite;
        }

        /* 2. 籤飛出並翻轉開啟動畫 */
        @keyframes drawOut {
            0% {
                bottom: 20px;
                opacity: 0;
                transform: scale(0.3) rotateX(90deg);
            }
            50% {
                bottom: 90px;
                opacity: 1;
                transform: scale(1.1) rotateX(0deg);
            }
            100% {
                bottom: 60px;
                opacity: 1;
                transform: scale(1) rotateX(0deg);
            }
        }
        .stick-out {
            animation: drawOut 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎲 線上抽籤系統</h1>

    <div class="input-group">
        <label for="totalPicks">全部幾支籤：</label>
        <input type="number" id="totalPicks" min="1" value="10">
    </div>

    <div class="input-group">
        <label for="winningPicks">中獎幾支籤：</label>
        <input type="number" id="winningPicks" min="0" value="2">
    </div>

    <div class="btn-group">
        <button class="btn-setup" onclick="initLottery()">重設/開始籤桶</button>
        <button class="btn-draw" id="drawBtn" onclick="draw()" disabled>開始抽籤</button>
    </div>

    <div class="status-box" id="status">
        請設定籤數並點擊「重設/開始籤桶」
    </div>

    <!-- 視覺動畫展演區 -->
    <div class="stage">
        <div class="bucket" id="bucket">🏺</div>
        <div class="stick" id="stick"></div>
    </div>
</div>

<script>
    let pool = []; 
    let isDrawing = false; // 防止動畫期間重複點擊

    function initLottery() {
        if (isDrawing) return;

        const total = parseInt(document.getElementById('totalPicks').value);
        const win = parseInt(document.getElementById('winningPicks').value);

        if (isNaN(total) || total <= 0) {
            alert('請輸入有效的全部籤數！');
            return;
        }
        if (isNaN(win) || win < 0) {
            alert('請輸入有效的中獎籤數！');
            return;
        }
        if (win > total) {
            alert('中獎籤數不能大於全部籤數！');
            return;
        }

        // 初始化籤筒
        pool = [];
        for (let i = 0; i < win; i++) pool.push(true);
        for (let i = 0; i < (total - win); i++) pool.push(false);

        // 重置介面與按鈕
        document.getElementById('drawBtn').disabled = false;
        updateStatus(total, win);

        const stick = document.getElementById('stick');
        stick.className = 'stick';
        stick.textContent = '準備抽籤';
        stick.style.opacity = '0';
    }

    function draw() {
        if (isDrawing) return;
        if (pool.length === 0) {
            alert('籤筒已經空了！請重新設定籤桶。');
            return;
        }

        isDrawing = true;
        document.getElementById('drawBtn').disabled = true;

        const bucket = document.getElementById('bucket');
        const stick = document.getElementById('stick');

        // 清空前一次籤的動畫樣式
        stick.className = 'stick';
        stick.style.opacity = '0';

        // 階段一：開始搖晃籤筒 (持續 0.8 秒)
        bucket.classList.add('shaking');

        setTimeout(() => {
            // 停止搖晃
            bucket.classList.remove('shaking');

            // 隨機選取籤
            const randomIndex = Math.floor(Math.random() * pool.length);
            const isWin = pool.splice(randomIndex, 1)[0];

            // 設定抽出的籤內容與樣式
            if (isWin) {
                stick.textContent = '🎉 恭喜中獎！';
                stick.className = 'stick win stick-out';
            } else {
                stick.textContent = '💩 銘謝惠顧';
                stick.className = 'stick lose stick-out';
            }

            // 更新剩餘籤數
            const remainingTotal = pool.length;
            const remainingWin = pool.filter(item => item === true).length;
            updateStatus(remainingTotal, remainingWin);

            // 動畫完成，解除鎖定
            setTimeout(() => {
                isDrawing = false;
                if (remainingTotal > 0) {
                    document.getElementById('drawBtn').disabled = false;
                } else {
                    alert('所有籤已抽完！');
                }
            }, 600);

        }, 800); // 搖晃時間：800ms
    }

    function updateStatus(remainingTotal, remainingWin) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = `剩餘籤數：<b>${remainingTotal}</b> 支 | 剩餘中獎籤：<b>${remainingWin}</b> 支`;
    }
</script>

</body>
</html>
