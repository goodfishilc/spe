<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬以內數值與積木隨機出題學習網頁</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        /* 列印專用的抬頭與學生姓名資訊區 (螢幕畫面上預設隱藏) */
        .print-header {
            display: none;
        }
        
        /* 控制面板 */
        .control-panel {
            background-color: #ffffff;
            border: 2px solid #3498db;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .control-panel h3 {
            margin: 0;
            color: #2980b9;
            font-size: 1.1rem;
            width: 100%;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        /* 題目卡片 */
        .question-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            padding: 20px;
            margin-bottom: 25px;
            border-left: 6px solid #3498db;
            position: relative;
        }
        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .question-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
        }

        /* 兩列表格位值表 */
        .place-value-table {
            border-collapse: collapse;
            margin-left: auto;
            background-color: #fff;
        }
        .place-value-table th, 
        .place-value-table td {
            border: 2px solid #34495e;
            width: 42px;
            height: 36px;
            text-align: center;
            vertical-align: middle;
            padding: 0;
        }
        .place-value-table th {
            background-color: #ebf5fb;
            color: #2c3e50;
            font-size: 1.05rem;
            font-weight: bold;
        }
        .place-value-table td input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            outline: none;
            background: transparent;
            box-sizing: border-box;
        }

        /* 檢核結果提示狀態 */
        .status-badge {
            font-size: 1.1rem;
            font-weight: bold;
            margin-left: 10px;
            display: inline-block;
            min-width: 80px;
        }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }

        .place-value-table td input.input-correct {
            background-color: #d4edda;
            color: #155724;
        }
        .place-value-table td input.input-wrong {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* 輸入框與按鈕 */
        .setup-num-input {
            padding: 6px 10px;
            font-size: 1rem;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            width: 80px;
            outline: none;
        }
        button {
            padding: 8px 16px;
            font-size: 1rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #2980b9; }
        .btn-random { background-color: #27ae60; font-weight: bold; }
        .btn-random:hover { background-color: #219150; }
        .btn-print { background-color: #e67e22; font-weight: bold; margin-left: auto; }
        .btn-print:hover { background-color: #d35400; }

        .breakdown-info {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            background: #eef7fc;
            padding: 8px 12px;
            border-radius: 6px;
        }
        
        canvas {
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            width: 100%;
            height: auto;
            display: block;
        }

        /* 隱藏題目數字與解析的模式 */
        .hide-input .input-area,
        .hide-input .breakdown-info {
            display: none !important;
        }

        /* 🖨️ 列印專用 CSS（精確控制 2 頁 A4 輸出） */
        @page {
            size: A4 portrait;
            margin: 8mm 10mm; /* 適度縮減邊界以容納內容 */
        }

        @media print {
            .control-panel, h1, .status-badge {
                display: none !important;
            }

            /* 列印時顯示頂部標題與學生資訊欄 */
            .print-header {
                display: flex !important;
                justify-content: space-between;
                align-items: flex-end;
                border-bottom: 2px solid #000;
                padding-bottom: 4px;
                margin-bottom: 8px;
            }
            .print-title {
                font-size: 1.3rem;
                font-weight: bold;
                color: #000;
                margin: 0;
            }
            .print-student-info {
                font-size: 1rem;
                font-weight: bold;
                color: #000;
            }

            body {
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .container {
                max-width: 100% !important;
                width: 100% !important;
            }

            /* 縮減每張題目卡片的佔用空間 */
            .question-card {
                box-shadow: none !important;
                border: 1px solid #777 !important;
                border-left: 4px solid #333 !important;
                margin-bottom: 6px !important;
                padding: 6px 10px !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /* 第 5 題後強制分頁，讓每頁剛好 5 題 */
            #card-5 {
                page-break-after: always !important;
                break-after: page !important;
            }

            .question-header {
                margin-bottom: 4px !important;
            }

            .place-value-table th, 
            .place-value-table td {
                height: 26px !important;
                width: 36px !important;
            }

            .place-value-table td input {
                color: transparent !important;
                background-color: transparent !important;
            }

            canvas {
                border: 1px solid #888 !important;
                background-color: #fff !important;
                max-height: 110px !important; /* 壓縮 Canvas 高度防爆頁 */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>萬以內數值與積木學習網頁</h1>

    <!-- 🖨️ 列印專用表頭 (平時螢幕隱藏，列印時自動顯示) -->
    <div class="print-header">
        <h2 class="print-title">數值與積木位值表作業學習單</h2>
        <div class="print-student-info">
            ＿＿年 ＿＿班 &nbsp;&nbsp; 座號：＿＿ &nbsp;&nbsp; 姓名：＿＿＿＿＿＿
        </div>
    </div>

    <!-- 控制面板 (列印時隱藏) -->
    <div class="control-panel">
        <h3>🎲 題目設定與工具面板</h3>
        <div class="input-group">
            <label for="min-range">最小值：</label>
            <input type="number" id="min-range" class="setup-num-input" value="1" min="1" max="99999">
        </div>
        <div class="input-group">
            <label for="max-range">最大值：</label>
            <input type="number" id="max-range" class="setup-num-input" value="9999" min="1" max="99999">
        </div>
        <button class="btn-random" onclick="generateRandomQuestions()">產生 10 題隨機題目</button>

        <label class="checkbox-group">
            <input type="checkbox" id="toggle-input-cb" checked onchange="toggleInputVisibility()">
            顯示題目數字與輸入框
        </label>

        <button class="btn-print" onclick="window.print()">🖨️ 列印作業/學習單</button>
    </div>

    <!-- 10 題卡片容器 -->
    <div id="questions-container"></div>
</div>

<script>
    const TOTAL_QUESTIONS = 10;
    let questionAnswers = []; 

    function initPage() {
        generateRandomQuestions();
    }

    function toggleInputVisibility() {
        const isChecked = document.getElementById('toggle-input-cb').checked;
        const container = document.getElementById('questions-container');
        if (isChecked) {
            container.classList.remove('hide-input');
        } else {
            container.classList.add('hide-input');
        }
    }

    function generateRandomQuestions() {
        let min = parseInt(document.getElementById('min-range').value) || 1;
        let max = parseInt(document.getElementById('max-range').value) || 9999;

        if (min < 1) min = 1;
        if (max > 99999) max = 99999;
        if (min > max) {
            let temp = min; min = max; max = temp;
            document.getElementById('min-range').value = min;
            document.getElementById('max-range').value = max;
        }

        const isFiveDigits = max > 9999;
        const placeHeaders = isFiveDigits ? ['萬', '千', '百', '十', '個'] : ['千', '百', '十', '個'];
        const digitsCount = placeHeaders.length;

        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        questionAnswers = [];

        for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
            const randomVal = Math.floor(Math.random() * (max - min + 1)) + min;
            questionAnswers[i] = randomVal;

            let thHTML = placeHeaders.map(h => `<th>${h}</th>`).join('');
            
            let tdHTML = '';
            for (let d = 0; d < digitsCount; d++) {
                tdHTML += `<td><input type="text" maxlength="1" id="ans-${i}-${d}" oninput="handleInput(${i}, ${d}, ${digitsCount})" onkeydown="handleKeyDown(event, ${i}, ${d}, ${digitsCount})"></td>`;
            }

            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${i}`;
            card.innerHTML = `
                <div class="question-header">
                    <div>
                        <span class="question-title">第 ${i} 題</span>
                        <span class="input-area">
                            <label for="num-${i}">：</label>
                            <input type="number" id="num-${i}" class="setup-num-input" value="${randomVal}" min="1" max="99999" oninput="manualUpdateQuestion(${i}, ${digitsCount})">
                        </span>
                    </div>

                    <div style="display:flex; align-items:center;">
                        <table class="place-value-table">
                            <thead><tr>${thHTML}</tr></thead>
                            <tbody><tr>${tdHTML}</tr></tbody>
                        </table>
                        <span id="status-${i}" class="status-badge"></span>
                    </div>
                </div>

                <div class="breakdown-info" id="info-${i}"></div>
                <canvas id="canvas-${i}" width="950" height="150"></canvas>
            `;
            container.appendChild(card);
            
            updateBreakdownAndCanvas(i, randomVal, digitsCount);
        }
    }

    function manualUpdateQuestion(index, digitsCount) {
        const input = document.getElementById(`num-${index}`);
        let val = parseInt(input.value) || 0;
        if (val < 0) val = 0;
        if (val > 99999) val = 99999;

        questionAnswers[index] = val;
        updateBreakdownAndCanvas(index, val, digitsCount);
        checkAnswer(index, digitsCount);
    }

    function updateBreakdownAndCanvas(index, val, digitsCount) {
        const tenThous = Math.floor(val / 10000);
        const thous = Math.floor((val % 10000) / 1000);
        const hunds = Math.floor((val % 1000) / 100);
        const tens = Math.floor((val % 100) / 10);
        const ones = val % 10;

        const info = document.getElementById(`info-${index}`);
        let infoStr = '';
        if (digitsCount === 5) {
            infoStr += `<span><strong>萬位:</strong> ${tenThous} 個</span>`;
        }
        infoStr += `
            <span><strong>千位:</strong> ${thous} 個</span>
            <span><strong>百位:</strong> ${hunds} 個</span>
            <span><strong>十位:</strong> ${tens} 個</span>
            <span><strong>個位:</strong> ${ones} 個</span>
        `;
        info.innerHTML = infoStr;

        drawBlocks(index, val);
    }

    function handleInput(qIndex, digitIndex, totalDigits) {
        const input = document.getElementById(`ans-${qIndex}-${digitIndex}`);
        input.value = input.value.replace(/[^0-9]/g, '');

        if (input.value !== '' && digitIndex < totalDigits - 1) {
            document.getElementById(`ans-${qIndex}-${digitIndex + 1}`).focus();
        }

        checkAnswer(qIndex, totalDigits);
    }

    function handleKeyDown(e, qIndex, digitIndex, totalDigits) {
        if (e.key === 'Backspace') {
            const input = document.getElementById(`ans-${qIndex}-${digitIndex}`);
            if (input.value === '' && digitIndex > 0) {
                document.getElementById(`ans-${qIndex}-${digitIndex - 1}`).focus();
            }
        }
    }

    function checkAnswer(qIndex, totalDigits) {
        let userStr = '';
        let isFilled = true;

        for (let d = 0; d < totalDigits; d++) {
            const input = document.getElementById(`ans-${qIndex}-${d}`);
            if (input.value === '') {
                isFilled = false;
            }
            userStr += input.value;
        }

        const statusSpan = document.getElementById(`status-${qIndex}`);
        const correctVal = questionAnswers[qIndex];
        const targetStr = String(correctVal).padStart(totalDigits, '0');

        if (!isFilled) {
            statusSpan.innerText = '';
            for (let d = 0; d < totalDigits; d++) {
                const input = document.getElementById(`ans-${qIndex}-${d}`);
                input.className = '';
            }
            return;
        }

        if (userStr === targetStr) {
            statusSpan.innerText = '⭕ 正確';
            statusSpan.className = 'status-badge correct';
            for (let d = 0; d < totalDigits; d++) {
                const input = document.getElementById(`ans-${qIndex}-${d}`);
                input.className = 'input-correct';
            }
        } else {
            statusSpan.innerText = '❌ 再試試';
            statusSpan.className = 'status-badge wrong';
            for (let d = 0; d < totalDigits; d++) {
                const input = document.getElementById(`ans-${qIndex}-${d}`);
                input.className = 'input-wrong';
            }
        }
    }

    function drawBlocks(index, value) {
        const canvas = document.getElementById(`canvas-${index}`);
        const ctx = canvas.getContext('2d');
        
        if (value <= 0) {
            canvas.height = 60;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "16px sans-serif";
            ctx.fillStyle = "#aaa";
            ctx.fillText("請輸入數字", 20, 35);
            return;
        }

        const tenThous = Math.floor(value / 10000);
        const thousands = Math.floor((value % 10000) / 1000);
        const hundreds = Math.floor((value % 1000) / 100);
        const tens = Math.floor((value % 100) / 10);
        const ones = value % 10;

        const canvasWidth = canvas.width;
        const paddingX = 15;
        const rowHeight = 95;

        let tempX = paddingX;
        let totalRows = 1;

        function simulateWidth(w) {
            if (tempX + w > canvasWidth - paddingX) {
                tempX = paddingX;
                totalRows++;
            }
            tempX += w;
        }

        for (let i = 0; i < tenThous; i++) simulateWidth(65);
        if (tenThous > 0) tempX += 15;

        for (let i = 0; i < thousands; i++) simulateWidth(55);
        if (thousands > 0) tempX += 15;

        for (let i = 0; i < hundreds; i++) simulateWidth(42);
        if (hundreds > 0) tempX += 15;

        for (let i = 0; i < tens; i++) simulateWidth(18);
        if (tens > 0) tempX += 12;

        if (ones > 0) simulateWidth(Math.min(ones, 5) * 16);

        canvas.height = totalRows * rowHeight + 15;

        let currentX = paddingX;
        let currentY = 85;

        function checkWrap(itemWidth) {
            if (currentX + itemWidth > canvasWidth - paddingX) {
                currentX = paddingX;
                currentY += rowHeight;
            }
        }

        if (tenThous > 0) {
            for (let i = 0; i < tenThous; i++) {
                checkWrap(65);
                drawBox(ctx, currentX, currentY - 40, 50, 50, 25, "#d35400", "#f39c12");
                currentX += 65;
            }
            currentX += 15;
        }

        if (thousands > 0) {
            for (let i = 0; i < thousands; i++) {
                checkWrap(55);
                drawCube1000(ctx, currentX, currentY - 15);
                currentX += 55;
            }
            currentX += 15;
        }

        if (hundreds > 0) {
            for (let i = 0; i < hundreds; i++) {
                checkWrap(42);
                drawFlat100(ctx, currentX, currentY);
                currentX += 42;
            }
            currentX += 15;
        }

        if (tens > 0) {
            for (let i = 0; i < tens; i++) {
                checkWrap(18);
                drawBar10(ctx, currentX, currentY + 5);
                currentX += 18;
            }
            currentX += 12;
        }

        if (ones > 0) {
            checkWrap(Math.min(ones, 5) * 16);
            for (let i = 0; i < ones; i++) {
                const row = Math.floor(i / 5);
                const col = i % 5;
                drawUnit1(ctx, currentX + (col * 15), (currentY + 10) - (row * 15));
            }
        }
    }

    function drawBox(ctx, x, y, w, h, d, strokeColor = "#555", fillColor = "#ededed") {
        ctx.save();
        ctx.fillStyle = fillColor;
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + d, y - d * 0.5);
        ctx.lineTo(x + w + d, y - d * 0.5);
        ctx.lineTo(x + w, y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + w, y);
        ctx.lineTo(x + w + d, y - d * 0.5);
        ctx.lineTo(x + w + d, y + h - d * 0.5);
        ctx.lineTo(x + w, y + h);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    function drawUnit1(ctx, x, y) { drawBox(ctx, x, y, 9, 9, 4); }

    function drawBar10(ctx, x, y) {
        drawBox(ctx, x, y - 40, 9, 40, 4);
        ctx.strokeStyle = "#888";
        for (let i = 1; i < 10; i++) {
            ctx.beginPath();
            ctx.moveTo(x, y - (i * 4));
            ctx.lineTo(x + 9, y - (i * 4));
            ctx.stroke();
        }
    }

    function drawFlat100(ctx, x, y) {
        const w = 35, h = 5, d = 28;
        drawBox(ctx, x, y, w, h, d, "#444", "#ededed");
        ctx.save();
        ctx.strokeStyle = "#888";
        ctx.lineWidth = 0.8;
        for (let i = 1; i < 10; i++) {
            let startX = x + (i * d / 10);
            let startY = y - (i * d * 0.5 / 10);
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(startX + w, startY);
            ctx.stroke();

            let lineX = x + (i * w / 10);
            ctx.beginPath();
            ctx.moveTo(lineX, y);
            ctx.lineTo(lineX + d, y - d * 0.5);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawCube1000(ctx, x, y) {
        drawBox(ctx, x, y, 42, 42, 20);
        ctx.save();
        ctx.strokeStyle = "#888";
        ctx.lineWidth = 0.8;
        for (let i = 1; i < 10; i++) {
            ctx.beginPath();
            ctx.moveTo(x, y + (i * 4.2));
            ctx.lineTo(x + 42, y + (i * 4.2));
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x + (i * 4.2), y);
            ctx.lineTo(x + (i * 4.2), y + 42);
            ctx.stroke();
        }
        ctx.restore();
    }

    window.onload = initPage;
</script>

</body>
</html>
