<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小數學基本運算練習網頁產生器</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .control-panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: bold;
            min-width: 120px;
        }

        input[type="number"], select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        .worksheet {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            font-size: 1.1rem;
        }

        .calc-item {
            padding: 8px 0;
        }

        .word-item {
            margin-bottom: 20px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        details {
            margin-top: 8px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 8px 12px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
            color: #555;
            user-select: none;
        }

        summary:hover {
            color: var(--primary-color);
        }

        .detail-content {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #ddd;
            color: #444;
        }

        @media print {
            .control-panel {
                display: none;
            }
            body {
                background: white;
                padding: 0;
            }
            .worksheet {
                box-shadow: none;
                padding: 0;
            }
            details {
                display: none; /* 列印時預設隱藏解答與提示 */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="control-panel">
        <h2>國小數學練習題產生器</h2>
        <div class="form-group">
            <label for="calcCount">計算題數量：</label>
            <input type="number" id="calcCount" value="6" min="0" max="20">
        </div>
        <div class="form-group">
            <label for="wordCount">應用問題數量：</label>
            <input type="number" id="wordCount" value="3" min="0" max="10">
        </div>
        <button onclick="generateWorksheet()">產生新試卷</button>
        <button onclick="window.print()" style="background-color: #6c757d; margin-left: 10px;">列印試卷</button>
    </div>

    <div class="worksheet" id="worksheet">
        <!-- 動態生成的內容會放在這裡 -->
    </div>
</div>

<script>
    const wordProblemBank = [
        {
            q: "小明有 {a} 顆蘋果，平分給 {b} 個小朋友，每個人可以拿到幾顆？",
            type: "div",
            getA: () => { const b = Math.floor(Math.random() * 5) + 2; return b * (Math.floor(Math.random() * 8) + 2); },
            getB: (a) => Math.floor(Math.random() * 4) + 2,
            getHint: (a, b) => `請使用除法計算：將總數 ${a} 除以人數 ${b}。`,
            getAns: (a, b) => `${a} ÷ ${b} = ${a / b}<br>答：每人分到 ${a / b} 顆蘋果`
        },
        {
            q: "籃球場上有 {a} 個男生和 {b} 個女生，請問籃球場上共有幾個人？",
            type: "add",
            getA: () => Math.floor(Math.random() * 20) + 5,
            getB: () => Math.floor(Math.random() * 20) + 5,
            getHint: (a, b) => `請將男生的數量與女生的數量相加。`,
            getAns: (a, b) => `${a} + ${b} = ${a + b}<br>答：共有 ${a + b} 個人`
        },
        {
            q: "一本故事書共有 {a} 頁，小華昨天看了 {b} 頁，還有幾頁沒有看？",
            type: "sub",
            getA: () => Math.floor(Math.random() * 50) + 40,
            getB: () => Math.floor(Math.random() * 30) + 10,
            getHint: (a, b) => `用總頁數扣掉已經看的頁數。`,
            getAns: (a, b) => `${a} - ${b} = ${a - b}<br>答：還有 ${a - b} 頁`
        },
        {
            q: "一盒鉛筆有 {b} 支，老師買了 {a} 盒，共有幾支鉛筆？",
            type: "mul",
            getA: () => Math.floor(Math.random() * 8) + 2,
            getB: () => Math.floor(Math.random() * 10) + 6,
            getHint: (a, b) => `請用乘法計算：每盒的數量乘以總盒數。`,
            getAns: (a, b) => `${b} × ${a} = ${a * b}<br>答：共有 ${a * b} 支鉛筆`
        }
    ];

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateCalcQuestion() {
        const ops = ['+', '-', '×', '÷'];
        const op = ops[getRandomInt(0, 3)];
        let a, b;

        switch(op) {
            case '+':
                a = getRandomInt(10, 99);
                b = getRandomInt(10, 99);
                break;
            case '-':
                a = getRandomInt(20, 99);
                b = getRandomInt(10, a);
                break;
            case '×':
                a = getRandomInt(2, 99);
                b = getRandomInt(2, 9);
                break;
            case '÷':
                b = getRandomInt(2, 9);
                a = b * getRandomInt(2, 12);
                break;
        }
        // 計算題移除「答：」，直接留下填空劃線區
        return `${a} ${op} ${b} = _______`;
    }

    function generateWorksheet() {
        const calcCount = parseInt(document.getElementById('calcCount').value) || 0;
        const wordCount = parseInt(document.getElementById('wordCount').value) || 0;
        const worksheetEl = document.getElementById('worksheet');

        let html = '<h1 style="text-align: center; margin-bottom: 5px;">國小數學練習單</h1>';
        html += '<p style="text-align: right; color: #666; margin-bottom: 20px;">班級：_______ 姓名：_______ 得分：_______</p>';

        // 1. 計算題區塊 (完全移除「答：」)
        if (calcCount > 0) {
            html += '<div class="section-title">一、 基本計算題</div>';
            html += '<div class="calc-grid">';
            for (let i = 1; i <= calcCount; i++) {
                html += `<div class="calc-item">${i}. &nbsp; ${generateCalcQuestion()}</div>`;
            }
            html += '</div>';
        }

        // 2. 應用問題區塊 (提示與答：均提供隱藏展開功能)
        if (wordCount > 0) {
            html += '<div class="section-title" style="margin-top: 30px;">二、 應用問題</div>';
            for (let i = 1; i <= wordCount; i++) {
                const template = wordProblemBank[getRandomInt(0, wordProblemBank.length - 1)];
                let a, b;

                if (template.type === "div") {
                    b = getRandomInt(2, 6);
                    a = b * getRandomInt(2, 9);
                } else if (template.type === "sub") {
                    a = getRandomInt(40, 90);
                    b = getRandomInt(10, a - 5);
                } else {
                    a = template.getA();
                    b = template.getB(a);
                }

                const questionText = template.q.replace('{a}', a).replace('{b}', b);
                const hintText = template.getHint(a, b);
                const ansText = template.getAns(a, b);

                html += `
                    <div class="word-item">
                        <div><strong>${i}.</strong> ${questionText}</div>
                        
                        <!-- 提示：隱藏功能 -->
                        <details>
                            <summary>💡 點擊顯示提示</summary>
                            <div class="detail-content">${hintText}</div>
                        </details>

                        <!-- 答：隱藏功能 -->
                        <details>
                            <summary>📝 點擊顯示解答</summary>
                            <div class="detail-content">${ansText}</div>
                        </details>
                    </div>
                `;
            }
        }

        worksheetEl.innerHTML = html;
    }

    // 初始載入時自動產生一次
    window.onload = generateWorksheet;
</script>

</body>
</html>
