<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小數學基本運算練習網頁產生器</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --font-num-family: 'Fredoka', 'Courier New', monospace;
      --font-size-title: 1.5rem;
      --font-size-section: 1rem;
      --font-size-question: 0.875rem;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    .font-num {
      font-family: var(--font-num-family);
    }

    .dynamic-title {
      font-size: var(--font-size-title) !important;
    }
    .dynamic-section {
      font-size: var(--font-size-section) !important;
    }
    .dynamic-question {
      font-size: var(--font-size-question) !important;
    }

    .vertical-calc-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .horizontal-equation {
      font-family: var(--font-num-family);
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      text-align: center;
      padding: 0.5rem 0;
      color: #1e293b;
    }

    .vertical-grid {
      display: inline-block;
      border-top: 2px solid #1e293b;
      border-left: 2px solid #1e293b;
      border-right: 2px solid #1e293b;
      padding: 0.25rem;
      font-family: var(--font-num-family);
      font-size: 0.95rem;
    }

    .vertical-row {
      display: flex;
      justify-content: flex-end;
      gap: 0.1rem;
      height: 1.8rem;
      align-items: center;
      margin-bottom: 0.1rem;
      padding-right: 0.25rem;
    }

    .vertical-row:last-child {
      border-top: 2px solid #1e293b;
      padding-top: 0.1rem;
    }

    .digit-cell {
      width: 1.5rem;
      height: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-right: 1px solid #cbd5e1;
      padding: 0.15rem;
    }

    .digit-cell.empty {
      border-right: none;
    }

    .digit-cell.hidden-answer {
      color: transparent;
      user-select: none;
    }

    .operator-symbol {
      font-weight: bold;
      margin-right: 0.3rem;
      font-size: 1.1rem;
    }

    .input-answer {
      border: none;
      border-bottom: 1px dashed #666;
      background: transparent;
      width: 1.5rem;
      text-align: center;
      font-family: var(--font-num-family);
      font-weight: bold;
      padding: 0.25rem 0;
    }

    .input-answer.filled {
      background-color: #fef08a;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm 15mm 12mm 15mm;
      }
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 10.5pt;
      }
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
      input[type="text"], input[type="number"] {
        border: none !important;
        border-bottom: 1px dashed #666 !important;
        background: transparent !important;
      }
      .digit-cell.hidden-answer {
        color: #dc2626 !important;
        font-weight: bold !important;
      }
    }

    .print-only {
      display: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <header class="no-print bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <div class="bg-yellow-400 p-2 rounded-xl text-indigo-950 shadow-inner">
          <i data-lucide="calculator" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-black tracking-wide flex items-center gap-2">
            國小數學基本運算練習產生器
            <span class="text-xs bg-indigo-500 text-indigo-100 font-medium px-2 py-0.5 rounded-full">橫直式混合版</span>
          </h1>
          <p class="text-xs text-indigo-200">橫式列式 + 直式格線，含隱藏答案選項</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button onclick="setMode('online')" id="btn-mode-online" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-yellow-400 text-indigo-950 shadow">
          <i data-lucide="laptop" class="w-4 h-4"></i>
          <span>線上練習</span>
        </button>

        <button onclick="setMode('print')" id="btn-mode-print" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-indigo-800 text-indigo-100 hover:bg-indigo-600">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          <span>學習單預覽</span>
        </button>

        <button onclick="toggleAnswerKey()" id="btn-toggle-ans" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-indigo-800 text-indigo-100 hover:bg-indigo-600">
          <i data-lucide="eye" class="w-4 h-4"></i>
          <span id="txt-toggle-ans">顯示解答</span>
        </button>

        <button onclick="toggleHideVerticalAnswers()" id="btn-toggle-hide-vertical" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-purple-600 hover:bg-purple-700 text-white">
          <i data-lucide="eye-off" class="w-4 h-4"></i>
          <span id="txt-toggle-hide-vertical">隱藏直式答案</span>
        </button>

        <div class="h-5 w-px bg-indigo-500 mx-1"></div>

        <button onclick="triggerPrint(false)" class="px-3.5 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg text-xs font-bold shadow-md transition-all flex items-center gap-1.5">
          <i data-lucide="printer" class="w-4 h-4"></i>
          <span>列印題目</span>
        </button>

        <button onclick="triggerPrint(true)" class="px-3.5 py-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-xs font-bold shadow-md transition-all flex items-center gap-1.5">
          <i data-lucide="file-check" class="w-4 h-4"></i>
          <span>列印解答</span>
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">

    <aside class="no-print lg:col-span-3 bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 h-fit space-y-4">
      <div class="flex items-center justify-between border-b pb-3 border-slate-100">
        <div class="flex items-center space-x-2 text-indigo-600">
          <i data-lucide="sliders" class="w-5 h-5"></i>
          <h2 class="font-extrabold text-base">設定面板</h2>
        </div>
        <button onclick="generateWorksheet()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold px-2.5 py-1 rounded-lg">
          重置
        </button>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-extrabold text-slate-500 uppercase">1. 運算符號</label>
        <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded-lg">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="op-add" checked onchange="generateWorksheet()" class="w-4 h-4">
            <span class="text-xs font-bold">加法 (+)</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="op-sub" checked onchange="generateWorksheet()" class="w-4 h-4">
            <span class="text-xs font-bold">減法 (-)</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="op-mul" onchange="generateWorksheet()" class="w-4 h-4">
            <span class="text-xs font-bold">乘法 (×)</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="op-div" onchange="generateWorksheet()" class="w-4 h-4">
            <span class="text-xs font-bold">除法 (÷)</span>
          </label>
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-extrabold text-slate-500 uppercase">2. 位數範圍</label>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-semibold mb-1">第一個數</label>
            <select id="digits-num1" onchange="generateWorksheet()" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs font-bold">
              <option value="1">1位 (1-9)</option>
              <option value="2" selected>2位 (10-99)</option>
              <option value="3">3位 (100-999)</option>
              <option value="4">4位 (1000-9999)</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold mb-1">第二個數</label>
            <select id="digits-num2" onchange="generateWorksheet()" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs font-bold">
              <option value="1">1位 (1-9)</option>
              <option value="2" selected>2位 (10-99)</option>
              <option value="3">3位 (100-999)</option>
              <option value="4">4位 (1000-9999)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-extrabold text-slate-500 uppercase">3. 題數設定</label>
        <div class="space-y-2">
          <div class="flex items-center justify-between p-2 bg-slate-50 rounded">
            <span class="text-xs font-bold">題數</span>
            <input type="number" id="count-questions" min="1" max="20" value="5" onchange="generateWorksheet()" class="w-16 text-center bg-white border border-slate-300 rounded px-1 py-1 text-xs font-bold">
          </div>
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-extrabold text-slate-500 uppercase">4. 字型設定</label>
        <div class="space-y-2">
          <div>
            <label class="block text-[11px] font-bold mb-1">標題大小</label>
            <select id="opt-size-title" onchange="updateTypography()" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs font-bold">
              <option value="1.25rem">小 (20px)</option>
              <option value="1.5rem" selected>標準 (24px)</option>
              <option value="1.75rem">大 (28px)</option>
              <option value="2rem">特大 (32px)</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold mb-1">數字字型</label>
            <select id="opt-font-num" onchange="updateTypography()" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs font-bold">
              <option value="'Fredoka', sans-serif" selected>Fredoka (圓潤)</option>
              <option value="'Courier New', monospace">Courier (等寬)</option>
              <option value="'Noto Sans TC', sans-serif">Noto Sans (黑體)</option>
            </select>
          </div>
        </div>
      </div>

      <hr class="border-slate-100">

      <div class="space-y-2">
        <button onclick="generateWorksheet()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg flex items-center justify-center gap-2 text-xs">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          重新產生
        </button>
      </div>

    </aside>

    <main class="lg:col-span-9 bg-white rounded-2xl p-8 shadow-sm border border-slate-200">
      
      <div id="worksheet-header" class="border-b-2 border-slate-900 pb-4 mb-6">
        <div class="flex justify-between items-start mb-3">
          <div>
            <h1 class="dynamic-title text-2xl font-black text-slate-900">國小數學直式計算練習單</h1>
            <p class="text-xs text-slate-500 mt-1">橫式列式 + 直式格線練習</p>
          </div>
          <div class="border-2 border-slate-900 rounded-lg p-2 px-4 text-center">
            <span class="block text-[10px] text-slate-500 font-bold">得分</span>
            <span id="score-display" class="font-num text-2xl font-black text-indigo-700">______</span>
          </div>
        </div>

        <div class="grid grid-cols-4 gap-2 text-xs font-bold">
          <div>班級：_______</div>
          <div>座號：_____</div>
          <div>姓名：_______</div>
          <div>日期：___年__月__日</div>
        </div>
      </div>

      <div id="worksheet-content" class="space-y-6">
        <!-- 題目動態渲染 -->
      </div>

    </main>
  </div>

  <script>
    let isAnswerKeyVisible = false;
    let hideVerticalAnswers = false;
    let currentMode = 'online';
    let worksheetQuestions = [];

    function toggleHideVerticalAnswers() {
      hideVerticalAnswers = !hideVerticalAnswers;
      const btn = document.getElementById('btn-toggle-hide-vertical');
      const txt = document.getElementById('txt-toggle-hide-vertical');
      
      if (hideVerticalAnswers) {
        btn.classList.remove('bg-purple-600', 'hover:bg-purple-700');
        btn.classList.add('bg-red-600', 'hover:bg-red-700');
        txt.innerText = '顯示直式答案';
      } else {
        btn.classList.remove('bg-red-600', 'hover:bg-red-700');
        btn.classList.add('bg-purple-600', 'hover:bg-purple-700');
        txt.innerText = '隱藏直式答案';
      }
      renderVerticalCalcQuestions();
    }

    function updateTypography() {
      const sizeTitle = document.getElementById('opt-size-title').value;
      const fontNum = document.getElementById('opt-font-num').value;
      const root = document.documentElement;
      root.style.setProperty('--font-size-title', sizeTitle);
      root.style.setProperty('--font-num-family', fontNum);
    }

    function generateRandomNumber(digits) {
      const min = Math.pow(10, digits - 1);
      const max = Math.pow(10, digits) - 1;
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function createVerticalCalcHTML(num1, num2, operator) {
      let result, operatorSymbol, operatorText;
      
      switch(operator) {
        case '+':
          result = num1 + num2;
          operatorSymbol = '＋';
          operatorText = '+';
          break;
        case '-':
          result = Math.abs(num1 - num2);
          operatorSymbol = '－';
          operatorText = '-';
          break;
        case '*':
          result = num1 * num2;
          operatorSymbol = '×';
          operatorText = '×';
          break;
        case '/':
          result = Math.floor(num1 / num2);
          operatorSymbol = '÷';
          operatorText = '÷';
          break;
      }

      const num1Str = num1.toString();
      const num2Str = num2.toString();
      const resultStr = result.toString();
      const maxLen = Math.max(num1Str.length, num2Str.length, resultStr.length);

      let verticalHTML = `
        <div class="horizontal-equation dynamic-question">${num1} ${operatorText} ${num2} = ___</div>
        <div class="vertical-grid">
      `;

      verticalHTML += '<div class="vertical-row">';
      for (let i = maxLen - num1Str.length; i > 0; i--) {
        verticalHTML += '<div class="digit-cell empty"></div>';
      }
      for (let digit of num1Str) {
        verticalHTML += `<div class="digit-cell">${digit}</div>`;
      }
      verticalHTML += '</div>';

      verticalHTML += `<div class="vertical-row"><div class="operator-symbol">${operatorSymbol}</div>`;
      for (let i = maxLen - num2Str.length; i > 0; i--) {
        verticalHTML += '<div class="digit-cell empty"></div>';
      }
      for (let digit of num2Str) {
        verticalHTML += `<div class="digit-cell">${digit}</div>`;
      }
      verticalHTML += '</div>';

      verticalHTML += '<div class="vertical-row">';
      for (let i = maxLen - resultStr.length; i > 0; i--) {
        verticalHTML += '<div class="digit-cell empty"></div>';
      }
      for (let digit of resultStr) {
        const hiddenClass = hideVerticalAnswers ? 'hidden-answer' : '';
        verticalHTML += `<div class="digit-cell ${hiddenClass}">${digit}</div>`;
      }
      verticalHTML += '</div>';
      
      verticalHTML += '</div>';

      return verticalHTML;
    }

    function generateVerticalCalcQuestions() {
      worksheetQuestions = [];
      
      const d1 = parseInt(document.getElementById('digits-num1').value);
      const d2 = parseInt(document.getElementById('digits-num2').value);
      const count = parseInt(document.getElementById('count-questions').value) || 5;
      
      const operators = [];
      if (document.getElementById('op-add').checked) operators.push('+');
      if (document.getElementById('op-sub').checked) operators.push('-');
      if (document.getElementById('op-mul').checked) operators.push('*');
      if (document.getElementById('op-div').checked) operators.push('/');

      if (operators.length === 0) operators.push('+');

      for (let i = 0; i < count; i++) {
        let num1 = generateRandomNumber(d1);
        let num2 = generateRandomNumber(d2);
        const operator = operators[Math.floor(Math.random() * operators.length)];
        
        if (operator === '-' && num1 < num2) {
          [num1, num2] = [num2, num1];
        }

        worksheetQuestions.push({ num1, num2, operator, type: 'vertical' });
      }
    }

    function renderVerticalCalcQuestions() {
      const container = document.getElementById('worksheet-content');
      container.innerHTML = '';

      worksheetQuestions.forEach((q, idx) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'space-y-2 pb-4 border-b border-slate-200 last:border-b-0';
        qDiv.innerHTML = `
          <div class="text-xs font-bold text-slate-500">第 ${idx + 1} 題</div>
          ${createVerticalCalcHTML(q.num1, q.num2, q.operator)}
        `;
        container.appendChild(qDiv);
      });
    }

    function generateWorksheet() {
      generateVerticalCalcQuestions();
      renderVerticalCalcQuestions();
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-online').classList.toggle('bg-yellow-400', mode === 'online');
      document.getElementById('btn-mode-online').classList.toggle('bg-indigo-800', mode !== 'online');
      document.getElementById('btn-mode-print').classList.toggle('bg-indigo-800', mode === 'print');
      document.getElementById('btn-mode-print').classList.toggle('bg-indigo-600', mode !== 'print');
    }

    function toggleAnswerKey() {
      isAnswerKeyVisible = !isAnswerKeyVisible;
      const txt = document.getElementById('txt-toggle-ans');
      txt.innerText = isAnswerKeyVisible ? '隱藏解答' : '顯示解答';
      const cells = document.querySelectorAll('.digit-cell');
      cells.forEach(cell => {
        if (!hideVerticalAnswers) {
          cell.classList.toggle('hidden-answer', isAnswerKeyVisible);
        }
      });
    }

    function triggerPrint(withAnswers) {
      if (withAnswers) {
        isAnswerKeyVisible = true;
        hideVerticalAnswers = false;
      }
      window.print();
    }

    document.addEventListener('DOMContentLoaded', () => {
      generateWorksheet();
      updateTypography();
    });
  </script>

</body>
</html>
